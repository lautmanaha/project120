# פרויקט 120 - פרסום האתר ב-GitHub Pages בכל push לענף main
name: Deploy site
on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/CNAME"
      - "site/logo.svg"
      - "site/en/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site folder
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/CNAME _site/CNAME
          cp site/logo.svg _site/logo.svg
          mkdir -p _site/en && cp site/en/index.html _site/en/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
